# Publishes the site to GitHub Pages on every push, and once a day so the like count in the page
# descriptions stays current (see .github/likes-in-descriptions.mjs).
name: Publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 2 * * *" # 08:00 in India, every day
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Put the like count in the page descriptions
        run: node .github/likes-in-descriptions.mjs
        env:
          LIKES_URL: ${{ vars.LIKES_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
